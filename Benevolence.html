<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xe plus</title>
    <link rel="stylesheet" href="Benevolence.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="scrollToTopBtn/scrollToTopBtn.css" />
  </head>
  <body>
    <div class="Newsfeed">
      <div class="header" id="headerID"></div>
      <div class="content-card-slider">
        <div class="card-1" id="card-1Id"></div>
        <div class="slider-right"></div>
        <div class="slider-container" id="sliderID">
          <div class="slider-header" id="">
            <h2 class="slider-title">Danh Sách Xe Nổi Bật</h2>
            <div class="nav-buttons">
              <button class="nav-btn" id="prevBtn">&#8592;</button>
              <button class="nav-btn" id="nextBtn">&#8594;</button>
            </div>
          </div>
          <div class="header-line"></div>
          <div class="slider-wrapper">
            <div class="slides" id="slides"></div>
          </div>
          <div class="dots-container" id="dotsContainer"></div>
        </div>
      </div>
      <div
        id="scrollToTopBtn"
        class="scroll-btn"
        role="button"
        tabindex="0"
        title="Quay lại đầu trang"
      >
        <i class="fa-solid fa-arrow-up"></i>
      </div>
    </div>
    <script src="Benevolence.js"></script>
    <script src="scrollToTopBtn/scrollToTopBtn.js"></script>
  </body>
</html>

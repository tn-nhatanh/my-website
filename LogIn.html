<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="LogIn.css" type="text/css" />
  </head>
  <body>
    <div class="logIn">
      <h2>Đăng Nhập</h2>
      <form action="Home.html">
        <div>
          <input
            type="text"
            name="username"
            placeholder="Tên đăng nhập"
            required
          />
        </div>
        <div>
          <input
            type="password"
            name="password"
            placeholder="Mật khẩu"
            required
          />
        </div>
        <div>
          <label>
            <input type="checkbox" name="remember" /> Ghi nhớ đăng nhập
          </label>
          <a href="ResetPassWord.html">Quên mật khẩu</a>
        </div>
        <a href="Home.html"
          ><button name="buttonLogIn" type="submit">Đăng nhập</button></a
        ><a href="CreateAccount.html"
          ><button name="buttonCreateAccount" type="button">
            Tạo tài khoản
          </button>
        </a>
      </form>
    </div>
  </body>
</html>

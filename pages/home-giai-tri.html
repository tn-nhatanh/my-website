<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="../image/favicon.ico" />
    <link rel="stylesheet" href="../css/headerAndNav.css" />

    <link rel="stylesheet" href="../css/CategoryBlock.css" />

    <link rel="stylesheet" href="../css/article-pagination.css" />

  <body>
    <header class="header" id="headerID"></header>
    <nav class="nav-website">

    <div class="AffairsListContainer" id="AffairsListContainerID"></div>

      data-list-id="AffairsListContainerID"
      data-page-key="home-giai-tri"

    <footer id="footerID"></footer>
    <div
      id="scrollToTopBtn"
      class="scroll-btn"
      role="button"
      tabindex="0"
      title="Quay lại đầu trang"

      <i class="fa-solid fa-arrow-up"></i>

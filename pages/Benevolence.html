<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xe plus</title>
    <link rel="stylesheet" href="../css/Benevolence.css" />
    <link rel="icon" href="../image/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../scrollToTopBtn/scrollToTopBtn.css" />
  </head>
  <body>
    <div class="Newsfeed">
      <div class="header" id="headerID"></div>
      <div class="content-card-slider">
        <div class="card-1" id="card-1Id"></div>
        <div class="slider-right" id="sliderRightID"></div>
      </div>
      <div id="BenevolenceLookupID"></div>
      <div class="benevolence-article-section">
        <h2 class="benevolence-section-title">Tin xe mới nhất</h2>
        <div id="BenevolenceArticlesID"></div>
      </div>
      <div class="benevolence-topic-section">
        <h2 class="benevolence-section-title">Chủ đề xe nổi bật</h2>
        <div id="BenevolenceTopicsID"></div>
      </div>
      <div id="footerID"></div>
      <div
        id="scrollToTopBtn"
        class="scroll-btn"
        role="button"
        tabindex="0"
        title="Quay lại đầu trang"
      >
        <i class="fa-solid fa-arrow-up"></i>
      </div>
    </div>
    <script src="../js/Benevolence.js"></script>
    <script src="../scrollToTopBtn/scrollToTopBtn.js"></script>
  </body>
</html>
